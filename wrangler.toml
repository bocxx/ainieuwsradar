name = "ainieuwsradar"
compatibility_date = "2026-03-27"
# Geen workers.dev-tweeling: de site draait op het eigen domein (routes
# hieronder). Met true stond dezelfde content publiek en crawlbaar op
# <naam>.twilight-tooth-0aba.workers.dev (200, geen noindex).
workers_dev = false
# Geen versie-preview-URL's: elke deploy maakte anders een publieke
# <versie>-<naam>.twilight-tooth-0aba.workers.dev, ook met workers_dev = false.
preview_urls = false

routes = [
  { pattern = "ainieuwsradar.nl", custom_domain = true },
  { pattern = "www.ainieuwsradar.nl", custom_domain = true },
]

# Sinds de netwerkconsolidatie (okt 2026) serveert deze Worker geen site meer:
# src/worker.ts stuurt elk verzoek met een 301 door naar hetlaatsteainieuws.nl.
main = "src/worker.ts"

# Het [assets]-blok staat bewust uit. Met assets erbij zou Cloudflare bestaande
# pagina's uit ./dist serveren vóór de Worker draait. Voor die paden komt er dan
# nooit een redirect. Terugdraaien = `main` weghalen en dit blok terugzetten.
# [assets]
# directory = "./dist"
# not_found_handling = "404-page"

[observability]
enabled = true
